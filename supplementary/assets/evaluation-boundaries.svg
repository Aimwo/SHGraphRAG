<text x="788" y="584" font-size="20" font-weight="400" fill="#b9c9dd">No dropping empty, failed, or missing IDs</text>
<text x="56" y="657" font-size="20" font-weight="400" fill="#b9c9dd">Retrieval scope remains profile-specific; shared input IDs do not imply identical retrieval conditions.</text>
